[package]
name = "bharatos-bootloader"
version = "0.1.0"
edition = "2021"
authors = ["Ankit Singh <ankit@bharatos.in>"]
description = "BharatOS Sovereign UEFI Bootloader — Pure Rust, No Windows, Direct Hardware"

[[bin]]
name = "bharatos-bootloader"
path = "src/main.rs"

[dependencies]
# No external dependencies — pure bare metal!

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
