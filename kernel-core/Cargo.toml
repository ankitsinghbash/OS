[package]
name = "bharatos-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bharatos-funding"
path = "src/bin/funding_main.rs"

[[bin]]
name = "bharatos-kernel"
path = "src/main.rs"
authors = ["Ankit Singh <ankit@bharatos.in>"]
description = "Sovereign Delta-Neutral Arbitrage Engine in Pure Rust"

[dependencies]
colored = "2.1"
ureq = { version = "2.9", default-features = false, features = ["tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
